<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma Access IP Fetcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; color: #005a9c; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #005a9c;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #004475; }
        .error {
            background-color: #ffe3e3;
            color: #d12323;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #d12323;
        }
        .results {
            margin-top: 30px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-family: monospace;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fafafa;
            resize: vertical;
            box-sizing: border-box;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
        }
        .copy-btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Prisma Access Public IP Utility</h2>
        <form method="POST">
            <div class="form-group">
                <label for="token">API Token (Header-Key):</label>
                <input type="text" id="token" name="token" placeholder="Paste your API key here..." required>
            </div>
            <div class="form-group">
                <label for="service_type">Service Type:</label>
                <select id="service_type" name="service_type">
                    <option value="explicit-proxy" selected>Explicit Proxy</option>
                    <option value="mobile_user">Mobile Users (GlobalProtect)</option>
                    <option value="remote_network">Remote Networks</option>
                    <option value="clean_pipe">Clean Pipe</option>
                </select>
            </div>
            <button type="submit">Fetch IP Addresses</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if ips %}
            <div class="results">
                <h3>Public Egress IP Addresses</h3>
                <p>Below is a clean list of copy-pasteable IPs/Subnets:</p>
                <textarea id="ipList" readonly>{% for ip in ips %}{{ ip }}
{% endfor %}</textarea>
                <button class="copy-btn" onclick="copyToClipboard()">Copy List to Clipboard</button>
            </div>
        {% endif %}
    </div>

    <script>
        function copyToClipboard() {
            var copyText = document.getElementById("ipList");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("IP list copied to clipboard!");
        }
    </script>
</body>
</html>
